name: Docker and recovery checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native image
        run: docker compose build
      - name: Check runtime and OCR
        run: docker compose run --rm app doctor
      - name: Test documents, scoring, recovery and Excel
        run: docker compose run --rm -v "$PWD/tests:/tests:ro" --entrypoint python app -m unittest discover -s /tests -v
